# Test on GitHub's machines, then ask the server to deploy the commit that passed.
#
# The repository is public, so anyone can open a pull request, and a pull
# request can edit this file. Everything here is arranged so that doing so
# reaches nothing that matters.
#
# * Tests run on GitHub-hosted runners: a fresh virtual machine per job, thrown
#   away afterwards. A hostile pull request can run anything it likes there, and
#   it runs on a machine that holds nothing.
#
# * There is no self-hosted runner. This project used to have one on the VPS,
#   running as root with Docker, which is root on a box serving five other
#   sites. A pull request that edited `runs-on` could have run code there. The
#   runner is gone, so there is no machine of ours for a workflow to name.
#
# * Deploying needs the `production` environment, which only `main` may use,
#   and which holds the only secrets this workflow has. GitHub never gives
#   secrets to a pull request from a fork.
#
# * The deploy key cannot open a shell. It is a forced command on the server
#   (deploy/riftline-deploy): it accepts one commit sha, only one already on
#   main, and deploys exactly that. See docs/deploy.md.
#
# Everything runs inside the images, so a runner needs nothing but Docker, and
# the suite runs in the image that gets deployed rather than an approximation of
# it. The test job uses `docker build` and `docker run` rather than Compose,
# because the Compose file requires `.env` (the Riot key) and CI has no business
# holding one: the suite mocks Riot at the transport layer.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The token every job gets. Read-only: nothing here writes to the repository.
permissions:
  contents: read

# A second push while a deploy is mid-flight would leave two `compose up` runs
# racing over one SQLite file. The server takes a lock as well (see
# deploy/riftline-deploy), which also covers a deploy started by hand.
concurrency:
  group: riftline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build the API image
        run: docker build --pull -t riftline-api:ci ./backend

      - name: Backend suite
        run: docker run --rm riftline-api:ci python -m pytest -q

      - name: Backend lint
        run: docker run --rm riftline-api:ci ruff check app scripts tests

      # The build stage is `tsc -b && vite build` twice over (browser and
      # server bundles), so a type error or a broken bundle fails here rather
      # than shipping.
      - name: Build the web bundle
        run: docker build --pull --target build --build-arg BUILD_ID=ci -t riftline-web:ci ./frontend

      - name: Frontend lint
        run: docker run --rm riftline-web:ci pnpm lint

      - name: Frontend tests
        run: docker run --rm riftline-web:ci pnpm test

      # The frontend compiles against types generated from the API's OpenAPI
      # document. Both the document and the types are committed; here they
      # are made again from the code in this commit, so a backend change that
      # was not followed by `python -m scripts.openapi` and `pnpm api:types`
      # fails here instead of reaching a page as `undefined`.
      - name: API schema and generated types are current
        run: |
          docker run --rm -e RIOT_API_KEY=RGAPI-ci-placeholder riftline-api:ci \
            python -m scripts.openapi /dev/stdout > /tmp/openapi.json
          diff -u frontend/openapi.json /tmp/openapi.json
          docker run --rm riftline-web:ci sh -c \
            'node scripts/api-types.mjs --out /tmp/gen.d.ts >/dev/null && diff -u src/lib/api.gen.d.ts /tmp/gen.d.ts'

      # Googlebot reads only the first 2 MB of a file, silently. The bundle is
      # a third of that today; this is the fence before it grows there.
      - name: Bundle size budget
        run: |
          docker run --rm riftline-web:ci sh -c '
            big=$(find dist/assets -name "*.js" -size +1500k)
            if [ -n "$big" ]; then echo "::error::JS file over 1.5 MB: $big"; exit 1; fi
            ls -l dist/assets'

      # The nginx stage, with its template rendered for a build id, must parse.
      - name: Build the web image and check its nginx config
        run: |
          docker build --pull --build-arg BUILD_ID=ci -t riftline-nginx:ci ./frontend
          docker run --rm riftline-nginx:ci nginx -t

      # The prerender job end to end, against the real API on an empty
      # database: every fixed page must come out as HTML with its own title
      # and heading, the shell must not, and the manifest must agree. With no
      # corpus every champion is below the floor, which is the noindex path.
      - name: Prerender against an empty API
        run: |
          docker network create ci
          docker run -d --name api --network ci \
            -e RIOT_API_KEY=RGAPI-ci-placeholder \
            -e DATABASE_URL=sqlite+aiosqlite:////tmp/ci.db \
            riftline-api:ci
          for i in $(seq 1 30); do
            if docker exec api python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/meta/pages', timeout=5).status == 200 else 1)" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          docker build --target prerender --build-arg BUILD_ID=ci -t riftline-prerender:ci ./frontend
          docker run --rm --network ci -v ci_pages:/pages riftline-prerender:ci
          docker run --rm -v ci_pages:/pages alpine sh -c '
            set -e
            test -f /pages/ci/index.html
            test -f /pages/ci/tierlist.html
            test -f /pages/ci/method/score.html
            grep -q "<h1" /pages/ci/tierlist.html
            grep -q "<title data-head=\"title\">Champion tier list" /pages/ci/tierlist.html
            grep -q "rel=\"canonical\"" /pages/ci/method/score.html
            ! grep -q "name=\"robots\"" /pages/ci/tierlist.html
            grep -q "__RQ_STATE__" /pages/ci/index.html
            cat /pages/ci/_manifest.json'

      # The served site in a real browser: the prerendered pages hydrate with
      # no hydration error, the selects and tabs are real controls, the
      # search navigates, the search dialog opens from the keyboard. The page
      # server is prerender/serve.mjs, which serves the pages volume in
      # nginx's try_files order and proxies /api to the container above;
      # Playwright runs on the runner against it.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Browser smoke test
        working-directory: frontend
        run: |
          docker run -d --name web-ci --network ci -p 6123:6123 -v ci_pages:/pages riftline-prerender:ci \
            node prerender/serve.mjs --pages /pages/ci --api http://api:8000 --port 6123
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          for i in $(seq 1 15); do curl -sf -o /dev/null http://127.0.0.1:6123/ && break; sleep 2; done
          E2E_BASE_URL=http://127.0.0.1:6123 pnpm exec playwright test
      # A profile through the real nginx: sent to the live renderer when it
      # has a file, served its file whenever the renderer cannot answer, and
      # the noindex shell when it has none. The empty corpus lists no
      # profiles, so a planted file stands in for one: the renderer refuses
      # it as unlisted, which is the fallback path this checks.
      - name: Profiles through nginx, with and without the live renderer
        run: |
          # On a failure, what nginx answered and what both servers logged.
          trap 'cat headers.txt 2>/dev/null; docker logs web-nginx 2>&1 | tail -20; docker logs render 2>&1 | tail -20' ERR
          docker run --rm -v ci_pages:/pages alpine sh -c 'mkdir -p "/pages/ci/summoner/euw1/Ci Player" && cp /pages/ci/index.html "/pages/ci/summoner/euw1/Ci Player/CI1.html"'
          docker run -d --name render --network ci riftline-prerender:ci node prerender/live.mjs
          docker run -d --name web-nginx --network ci -p 6124:80 -v ci_pages:/usr/share/nginx/html/pages:ro riftline-nginx:ci
          set -E
          for i in $(seq 1 15); do
            if docker exec render wget -q -O /dev/null http://127.0.0.1:3000/healthz && curl -sf -o /dev/null http://127.0.0.1:6124/; then break; fi
            sleep 2
          done
          check_file() {
            curl -s -D headers.txt -o body.txt "http://127.0.0.1:6124/summoner/euw1/Ci%20Player/CI1"
            head -1 headers.txt | grep -q ' 200'
            grep -qi '^x-prerendered: ci' headers.txt
            # An `if`, because `bash -e` never fails a step on a `!` command.
            if grep -qi '^x-robots-tag' headers.txt; then echo "the profile was served the noindex shell" >&2; exit 1; fi
            grep -q '<h1' body.txt
          }
          docker exec render wget -S -O /dev/null "http://127.0.0.1:3000/summoner/euw1/Ci%20Player/CI1" 2>&1 | grep -q ' 404'
          check_file
          docker rm -f render
          check_file
          curl -sI http://127.0.0.1:6124/summoner/euw1/Nobody/X1 | grep -qi '^x-robots-tag: noindex'

      # An earlier build's hashed file, which the prerender job keeps in the
      # pages volume, is served by nginx after the image's own: a page from
      # the edge cache asks for the files it was rendered with. And a page's
      # own cache header, which the edge cache rule in docs/deploy.md obeys.
      - name: Earlier builds' files and the page cache header, through nginx
        run: |
          docker run --rm -v ci_pages:/pages alpine sh -c '
            set -e
            test -s /pages/ci/_assets.json
            test -n "$(ls /pages/_shared/assets)"
            echo kept > /pages/_shared/assets/kept-ci.js'
          curl -sf -D headers.txt -o /dev/null http://127.0.0.1:6124/assets/kept-ci.js
          grep -qi '^cache-control: public, max-age=31536000, immutable' headers.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:6124/assets/missing-ci.js)" = 404
          curl -sI http://127.0.0.1:6124/tierlist | grep -qi '^cache-control: public, max-age=0, s-maxage=300, stale-while-revalidate=60'

      - name: Stop the CI containers
        if: always()
        run: docker rm -f web-ci web-nginx render api 2>/dev/null || true

      - name: No em dashes
        # A house rule, enforced rather than remembered.
        #
        # The pattern is spelled as its UTF-8 bytes rather than written out,
        # so this file can be swept along with everything else instead of
        # matching itself forever.
        run: |
          dash=$(printf '\342\200\224')
          if grep -rn "$dash" \
               --include="*.ts" --include="*.tsx" --include="*.py" \
               --include="*.css" --include="*.md" --include="*.yml" \
               --include="*.sh" --include="*.conf" --include="Dockerfile" \
               --include="Makefile" --include="*.service" --include="*.timer" \
               backend/app backend/scripts backend/tests frontend/src \
               docs deploy .github Makefile docker-compose.yml; then
            echo "::error::em dash found; use commas, periods or parentheses"
            exit 1
          fi

  deploy:
    name: Deploy
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://www.rhasta.space
    steps:
      # No checkout: the server fetches the commit itself, from the public
      # repository, and refuses anything that is not on main.
      - name: Load the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Pinned, not scanned: the host key was read from the server over an
          # already-trusted session, so a first connection cannot be spoofed.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The server runs deploy/riftline-deploy whatever is asked for; the sha is
      # the only thing it reads. It deploys this exact commit, not whatever main
      # points at by now, so a push that lands mid-run cannot ship untested.
      - name: Deploy this commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              "root@${DEPLOY_HOST}" "${GITHUB_SHA}"
