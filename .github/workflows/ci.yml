# Test on GitHub's machines, then ask the server to deploy the commit that passed.
#
# The repository is public, so anyone can open a pull request, and a pull
# request can edit this file. Everything here is arranged so that doing so
# reaches nothing that matters.
#
# * Tests run on GitHub-hosted runners: a fresh virtual machine per job, thrown
#   away afterwards. A hostile pull request can run anything it likes there, and
#   it runs on a machine that holds nothing.
#
# * There is no self-hosted runner. This project used to have one on the VPS,
#   running as root with Docker, which is root on a box serving five other
#   sites. A pull request that edited `runs-on` could have run code there. The
#   runner is gone, so there is no machine of ours for a workflow to name.
#
# * Deploying needs the `production` environment, which only `main` may use,
#   and which holds the only secrets this workflow has. GitHub never gives
#   secrets to a pull request from a fork.
#
# * The deploy key cannot open a shell. It is a forced command on the server
#   (deploy/riftline-deploy): it accepts one commit sha, only one already on
#   main, and deploys exactly that. See docs/deploy.md.
#
# Everything runs inside the images, so a runner needs nothing but Docker, and
# the suite runs in the image that gets deployed rather than an approximation of
# it. The test job uses `docker build` and `docker run` rather than Compose,
# because the Compose file requires `.env` (the Riot key) and CI has no business
# holding one: the suite mocks Riot at the transport layer.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The token every job gets. Read-only: nothing here writes to the repository.
permissions:
  contents: read

# A second push while a deploy is mid-flight would leave two `compose up` runs
# racing over one SQLite file. The server takes a lock as well (see
# deploy/riftline-deploy), which also covers a deploy started by hand.
concurrency:
  group: riftline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build the API image
        run: docker build --pull -t riftline-api:ci ./backend

      - name: Backend suite
        run: docker run --rm riftline-api:ci python -m pytest -q

      - name: Backend lint
        run: docker run --rm riftline-api:ci ruff check app scripts tests

      # The build stage is `tsc -b && vite build`, so a type error or a broken
      # bundle fails here rather than shipping.
      - name: Build the web bundle
        run: docker build --pull --target build -t riftline-web:ci ./frontend

      - name: Frontend lint
        run: docker run --rm riftline-web:ci pnpm lint

      - name: No em dashes
        # A house rule, enforced rather than remembered.
        #
        # The pattern is spelled as its UTF-8 bytes rather than written out,
        # so this file can be swept along with everything else instead of
        # matching itself forever.
        run: |
          dash=$(printf '\342\200\224')
          if grep -rn "$dash" \
               --include="*.ts" --include="*.tsx" --include="*.py" \
               --include="*.css" --include="*.md" --include="*.yml" \
               --include="*.sh" --include="*.conf" --include="Dockerfile" \
               --include="Makefile" --include="*.service" --include="*.timer" \
               backend/app backend/scripts backend/tests frontend/src \
               docs deploy .github Makefile docker-compose.yml; then
            echo "::error::em dash found; use commas, periods or parentheses"
            exit 1
          fi

  deploy:
    name: Deploy
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://riftline.rhasta.space
    steps:
      # No checkout: the server fetches the commit itself, from the public
      # repository, and refuses anything that is not on main.
      - name: Load the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Pinned, not scanned: the host key was read from the server over an
          # already-trusted session, so a first connection cannot be spoofed.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The server runs deploy/riftline-deploy whatever is asked for; the sha is
      # the only thing it reads. It deploys this exact commit, not whatever main
      # points at by now, so a push that lands mid-run cannot ship untested.
      - name: Deploy this commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              "root@${DEPLOY_HOST}" "${GITHUB_SHA}"
