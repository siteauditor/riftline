# Serving the built site, the prerendered pages, and the /api hop.
#
# Installed as /etc/nginx/templates/default.conf.template: the nginx image
# substitutes ${BUILD_ID} at start, and only that. nginx's own variables have
# no braces and pass through untouched.
#
# The proxy is not a convenience. The client fetches relative paths ("/api/...",
# see lib/api.ts), which in development the Vite dev server proxies so the
# browser stays on one origin and CORS never enters the picture. Doing the same
# here keeps production identical to development in the one respect that is
# easiest to get subtly wrong, and means the browser never makes a cross-origin
# request at all. riftline-api.rhasta.space still serves the API directly for
# anything that wants to call it from outside.
#
# Pages. The prerender job (prerender/run.mjs) writes one HTML file per page
# into a volume mounted at /usr/share/nginx/html/pages/<BUILD_ID>, and a
# request is answered with that file when it exists, with the built app's
# shell otherwise. Being prerendered is what makes a URL indexable: the shell
# is sent with a noindex header, so a URL that has no page (a typo, a champion
# below the sample floor, a profile nobody has opened) never enters an index
# as an empty document. The same HTML goes to everyone; there is no user-agent
# branch anywhere here, which is what Google's rules for prerendering ask.
#
# TLS, HSTS and compression are the edge proxy's job (caddy-docker-proxy), not
# this file's.

# The edge proxy terminates TLS and sets this, but an empty value would reach
# uvicorn's --proxy-headers as a scheme of "", so it gets a default. A map must
# sit in the http context, which is what conf.d files are included into.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      https;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects carry a path, not a URL. nginx sees the request as http behind
    # the edge proxy, so an absolute Location pointed a /tierlist/ visitor at
    # http://riftline.rhasta.space/tierlist and cost a second hop through
    # Cloudflare (measured on the first prerendered deploy, 2026-09-23).
    absolute_redirect off;

    # Trust the edge for the client's real address, so API logs and any future
    # rate limiting see the visitor rather than the Docker network. Private
    # ranges only: the edge proxy is the only peer that can reach this container,
    # and trusting 0.0.0.0/0 would let any header through if that ever changed.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    # Vite fingerprints these, so they can be cached hard and for ever.
    # One header, spelled out: `expires 1y` would emit a Cache-Control of its
    # own and the response would carry the header twice.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        # Docker's embedded DNS, re-resolved rather than pinned at startup: a
        # rebuilt api container gets a new address, and without this nginx would
        # hold the old one and 502 until it was restarted too.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:8000;
        # $request_uri spelled out: with a variable upstream, relying on nginx's
        # implicit pass-through of the original URI is a subtlety nobody should
        # have to remember while reading this.
        proxy_pass $api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # A cold match-history page fetches from Riot inside the request, and a
        # rate-limited key makes that slow by design. The default 60s would turn
        # a legitimate wait into a 504.
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # The sitemap is the API's: the same list of pages the prerender job
    # rendered, so it can never name a page that does not exist.
    location = /sitemap.xml {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:8000;
        proxy_pass $api/api/meta/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Only try_files below reads these; asked for by name they are a 404.
    location ^~ /pages/ {
        internal;
    }

    location / {
        # One address per page: /tierlist/ is /tierlist, not a second copy.
        rewrite ^/(.+)/$ /$1 permanent;
        # This build's prerendered page for the path, else the app.
        try_files /pages/${BUILD_ID}$uri.html /pages/${BUILD_ID}$uri/index.html @app;
        # A page may sit in the edge cache for an hour and be served stale for a
        # day while it revalidates: its numbers move once a night, when the
        # prerender job replaces the file. Browsers revalidate every time.
        add_header Cache-Control "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400";
        add_header X-Prerendered "${BUILD_ID}";
    }

    # A profile is rendered on request with the rank Riot gives now, by the
    # render container (prerender/live.mjs): its file is written from
    # storage, and a stored rank moves only when someone opens the page, so a
    # crawler or a link preview read a rank up to a day old. Only a profile
    # that has a file goes there, so what is indexable is still decided by the
    # prerender. Anything the renderer cannot answer (down, slow, a 404 for a
    # page it does not list) is served the file, as before it existed.
    location ~ ^/summoner/[^/]+/[^/]+/[^/]+$ {
        error_page 418 = @live_profile;
        if (-f $document_root/pages/${BUILD_ID}$uri.html) {
            return 418;
        }
        try_files $uri @app;
    }

    location @live_profile {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $render http://render:3000;
        proxy_pass $render$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The renderer gives Riot three seconds and then renders from storage;
        # past this something is wrong with it, and the file is the answer.
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        proxy_intercept_errors on;
        # The 418 that sent the request here was its one error_page redirect;
        # without this the fallback below is refused and nginx answers its own
        # 404 (seen in CI on the first run of the profile check).
        recursive_error_pages on;
        error_page 404 500 502 503 504 = @profile_file;
    }

    location @profile_file {
        try_files /pages/${BUILD_ID}$uri.html @app;
        add_header Cache-Control "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400";
        add_header X-Prerendered "${BUILD_ID}";
    }

    # Static files from the build, then the shell for everything else.
    location @app {
        try_files $uri $uri/ /index.html;
    }

    # Not in nginx's mime.types, so it went out as application/octet-stream.
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # The shell. Never cached, or a deploy leaves browsers loading a bundle that
    # no longer exists. Never indexed: a URL that reaches it has no prerendered
    # page, and an empty document is the wrong answer to a crawler either way.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml application/xml;
    gzip_min_length 1024;
}
