# Riftline on the shared VPS.
#
# Two containers, no published ports. TLS, certificates and HTTP routing belong
# to the `caddy-docker-proxy` container that already fronts this box, which
# reads the `caddy` labels below off any container attached to `edge_default`.
# That network is created and owned by the `edge` project (/root/edge), hence
# `external: true`: Compose uses it and must never create or delete it.
#
# The consequence worth stating: deploying or tearing down this project cannot
# affect the five other sites on this box, because nothing here is shared with
# them except a network they already expect strangers on. There is no edit to
# /root/edge and no host port to collide over.
#
# `configurespaces.rhasta.space` and `configurespaces-api.rhasta.space` are set
# up exactly this way on the same box and in the same DNS zone, which is why the
# label shape below is copied rather than invented.

services:
  api:
    build:
      context: ./backend
    image: riftline-api:local
    container_name: riftline-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Absolute, and inside the volume. The app would otherwise anchor a
      # relative path to its project root, which works but leaves the most
      # important file on the box implicit.
      DATABASE_URL: sqlite+aiosqlite:////srv/riftline/data/lol.db
      # The browser reaches the API same-origin through the web container, so
      # this only matters for anything calling riftline-api.rhasta.space
      # directly from a page.
      CORS_ORIGINS: https://www.rhasta.space
    volumes:
      # The corpus: 1,795 matches, every stored Riot payload, and the scores
      # derived from them. A named volume rather than a bind mount so a stray
      # `git clean` in the deploy directory cannot reach it.
      - riftline_data:/srv/riftline/data
    networks: [default, edge]
    labels:
      caddy: riftline-api.rhasta.space
      caddy.reverse_proxy: '{{upstreams 8000}}'
      caddy.encode: zstd gzip
      caddy.header.Strict-Transport-Security: '"max-age=31536000; includeSubDomains"'
      caddy.header.X-Content-Type-Options: nosniff
      caddy.header.Referrer-Policy: strict-origin-when-cross-origin
    healthcheck:
      # The app's own readiness answer: it reports the key, the Data Dragon
      # version and the rate-limit state, so a container that is up but cannot
      # serve is not called healthy.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  web:
    build:
      context: ./frontend
      args:
        # The short commit sha, exported by deploy/deploy.sh. Baked into the
        # image, so a later `up` without it changes nothing.
        BUILD_ID: ${BUILD_ID:-dev}
    image: riftline-web:local
    container_name: riftline-web
    restart: unless-stopped
    volumes:
      # The prerendered pages, written by the prerender service below and read
      # here from /pages/<BUILD_ID>. Read-only: nginx only ever serves them.
      - riftline_pages:/usr/share/nginx/html/pages:ro
    depends_on:
      # Not a hard gate: nginx re-resolves the upstream, so the site comes up
      # and serves the shell even if the API is still starting.
      api:
        condition: service_started
    networks: [default, edge]
    labels:
      # Two site blocks on one container (caddy_0, caddy_1): the site, and the
      # names that redirect to it. The bare domain and the launch name both
      # answer 301 with the path kept, so nothing that ever linked here breaks.
      caddy_0: www.rhasta.space
      caddy_0.reverse_proxy: '{{upstreams 80}}'
      caddy_0.encode: zstd gzip
      caddy_0.header.Strict-Transport-Security: '"max-age=31536000; includeSubDomains"'
      caddy_0.header.X-Content-Type-Options: nosniff
      caddy_0.header.Referrer-Policy: strict-origin-when-cross-origin
      caddy_1: rhasta.space, riftline.rhasta.space
      caddy_1.redir: 'https://www.rhasta.space{uri} permanent'
    healthcheck:
      # BusyBox wget. Two -O flags (as in `-qO- ... -O /dev/null`) is the kind
      # of thing that works until it does not.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # The prerender job: the same build as `web`, run to completion rather than
  # kept up. `docker compose run --rm prerender`, at each deploy before the new
  # web container starts and each night after the corpus moves. The profile
  # keeps `up` from starting it.
  prerender:
    build:
      context: ./frontend
      target: prerender
      args:
        BUILD_ID: ${BUILD_ID:-dev}
    image: riftline-prerender:local
    profiles: [tools]
    environment:
      API_BASE: http://api:8000
      PRERENDER_OUT: /pages
    volumes:
      - riftline_pages:/pages
    networks: [default]
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  default:
    name: riftline_default
  edge:
    external: true
    name: edge_default

volumes:
  # The prerendered pages. Compose's own: it holds nothing that cannot be made
  # again by running the prerender service. Named outright, as `riftline_data`
  # is, so it reads the same in `docker volume ls` and in docs/deploy.md
  # rather than as the project-prefixed `riftline_riftline_pages`.
  riftline_pages:
    name: riftline_pages
  # Created by hand before the first deploy (docs/deploy.md, "The corpus"), so
  # the database can be copied in before anything runs, and therefore owned
  # outside this project like `edge_default`. Declared as Compose's own, every
  # deploy warned "already exists but was not created by Docker Compose". It also
  # means `docker compose down -v` can never delete the corpus, and a missing
  # volume stops the deploy instead of starting the site on an empty database.
  riftline_data:
    external: true
    name: riftline_data
